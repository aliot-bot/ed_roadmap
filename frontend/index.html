<!doctype html>
<html lang="ru">
  <head>
    <script>
      (() => {
        const saved = localStorage.getItem('roadmap-theme')
        const preferred = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = preferred
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f3f3" />
    <meta name="description" content="Личная карта знаний и прогресса" />
    <title>Карта знаний</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
